<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Status | {{ part.work_order_no }}</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f7f6; padding: 40px; }
        .form-container { background: white; padding: 30px; max-width: 500px; margin: auto; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #333; }
        select, textarea { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn-save { background: #28a745; color: white; border: none; padding: 12px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; }
        .btn-save:hover { background: #218838; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #666; text-decoration: none; }
    </style>
</head>
<body>
    <div class="form-container">
        <h3>Update Work Order: {{ part.work_order_no }}</h3>
        <hr>
        <form method="POST" enctype="multipart/form-data"> {% csrf_token %}
    
    <input type="hidden" name="work_order_no" value="{{ part.work_order_no }}">
    <input type="hidden" name="serial_number" value="{{ part.serial_number }}">

    <div class="form-group">
        <label for="status">Change Status:</label>
        <select name="status" id="status">
            <option value="not started" {% if part.status == 'not started' %}selected{% endif %}>Not Started</option>
            <option value="in progress" {% if part.status == 'in progress' %}selected{% endif %}>In Progress</option>
            <option value="completed" {% if part.status == 'completed' %}selected{% endif %}>Completed</option>
            <option value="delivered" {% if part.status == 'delivered' %}selected{% endif %}>Delivered</option>
        </select>
    </div>

    <div class="form-group">
        <label for="pdf_file">Upload PDF Document:</label>
        <input type="file" name="pdf_file" id="pdf_file" accept="application/pdf">
        {% if part.pdf_file %}
            <p style="font-size: 0.8em; color: green;">Current file: {{ part.pdf_file.name }}</p>
        {% endif %}
    </div>

    <div class="form-group">
        <label for="note">Work Note / Report:</label>
        <textarea name="note" id="note" rows="5" placeholder="Write what has been done on this part..."></textarea>
    </div>

    <button type="submit" class="btn-save">Save & Update</button>
    <a href="{% url 'inventory_list' %}" class="back-link">Cancel and Return</a>
</form>
    </div>
</body>
</html>
