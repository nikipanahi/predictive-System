{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="card shadow border-0">
        <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
            <h3 class="card-title mb-0">Add New Part</h3>
            <span id="wo-preview" class="badge bg-light text-primary p-2 fs-6" style="font-family: monospace;">
                WO Preview: {{ now|date:"ym" }}-...
            </span>
        </div>
        <div class="card-body p-4">
            <form method="POST" enctype="multipart/form-data">
                {% csrf_token %}
                
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Part Number:</label>
                        <input type="text" name="part_number" id="pn_input" list="pn_list" class="form-control" placeholder="Search P/N..." required>
                        
                        <datalist id="pn_list">
                            {% for p in all_parts %}
                                <option value="{{ p.part_number }}" data-desc="{{ p.description }}">
                            {% endfor %}
                        </datalist>

                        <div id="part_desc_display" class="form-text text-success fw-bold mt-1"></div>
                        <div id="est_time_display" class="form-text text-primary fw-bold mt-1"></div>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label class="form-label fw-bold">Serial Number:</label>
                        <input type="text" name="serial_number" id="sn_input" class="form-control" placeholder="S/N">
                    </div>
                </div>

                <div id="history-section" class="mb-4 d-none">
                    <div class="alert alert-warning border-warning shadow-sm">
                        <h6 class="alert-heading fw-bold"><i class="fas fa-history"></i> Previous Records Found:</h6>
                        <div class="table-responsive">
                            <table class="table table-sm table-bordered mt-2 bg-white">
                                <thead class="table-light">
                                    <tr>
                                        <th>WO</th>
                                        <th>Date</th>
                                        <th>Customer</th>
                                        <th>Status</th>
                                        <th>Prev. Reason</th>
                                    </tr>
                                </thead>
                                <tbody id="history-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Customer:</label>
                    <select name="customer_id" id="customerSelect" class="form-select">
                        {% for cust in customers %}
                            <option value="{{ cust.id }}" data-code="{{ cust.code }}">{{ cust.name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Reason of Removal:</label>
                    <textarea name="reason_of_removal" class="form-control" rows="2" placeholder="Why was this part removed?"></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Upload Inspection PDF:</label>
                    <input type="file" name="pdf_file" class="form-control">
                </div>

                <div class="form-check mb-4 p-3 bg-light rounded border">
                    <input type="checkbox" name="is_non_official" class="form-check-input ms-0" id="nonOfficial" value="true">
                    <label class="form-check-label ms-2" for="nonOfficial">
                        <strong>Non-Official Record</strong>
                    </label>
                </div>

                <div class="d-grid">
                    <div id="warning-div" class="alert alert-danger d-none" role="alert">
    <i class="fas fa-exclamation-triangle me-2"></i>
    <span id="warning-text"></span>
</div>

<div class="d-grid">
    <button type="submit" class="btn btn-success btn-lg">Generate Work Order & Save
    </button>
</div>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    const pnInput = document.getElementById('pn_input');
    const snInput = document.getElementById('sn_input');
    const descDisplay = document.getElementById('part_desc_display');
    const estDisplay = document.getElementById('est_time_display');
    const customerSelect = document.getElementById('customerSelect');
    const nonOfficialCheck = document.getElementById('nonOfficial');
    const historySection = document.getElementById('history-section');
    const historyBody = document.getElementById('history-body');
    const dateCode = '{{ now|date:"ym" }}';

    // ۱. مدیریت پارت نامبر و توضیحات
    pnInput.addEventListener('input', function() {
        const val = this.value;
        const options = document.querySelectorAll('#pn_list option');
        let foundDesc = "";
        options.forEach(opt => {
            if (opt.value === val) foundDesc = opt.getAttribute('data-desc');
        });
        descDisplay.innerText = foundDesc ? "Part Name: " + foundDesc : "";
        fetchHistory(); 
    });

    // ۲. مدیریت سریال نامبر
    snInput.addEventListener('input', fetchHistory);

    function fetchHistory() {
        const pn = pnInput.value.trim();
        const sn = snInput.value.trim();
        const warningDiv = document.getElementById('warning-div');
        const warningText = document.getElementById('warning-text');
        if (pn) {
            fetch(`/inspection/check-history/?part_number=${encodeURIComponent(pn)}&serial_number=${encodeURIComponent(sn)}`)
                .then(response => response.json())
                .then(data => {
                    // --- بخش جدید برای نمایش هشدار ۵ تایی ---
                    if (data.warning) {
                    warningText.innerText = data.warning;
                    warningDiv.classList.remove('d-none'); // نمایش دادن
                } else {
                    warningDiv.classList.add('d-none'); // پنهان کردن اگر هشداری نبود
                }
                    // نمایش زمان تخمینی
                    // اصلاح این شرط: در views شما نام "Insufficient Data" را گذاشته بودید
                    if (data.estimated_lead_time && 
                        data.estimated_lead_time !== "No historical data" && 
                        data.estimated_lead_time !== "Insufficient Data") {
                    
                        estDisplay.innerHTML = `⏳ Estimated Repair Time: <span class="badge bg-info text-dark">${data.estimated_lead_time}</span>`;
                    } else {
                        estDisplay.innerHTML = `<span class="text-muted">Estimated Repair Time: No historical data</span>`;
                    }
                    // مدیریت جدول تاریخچه
                    if (data.exists) {
                        historyBody.innerHTML = '';
                        data.history.forEach(item => {
                            historyBody.innerHTML += `
                                <tr>
                                    <td><small class="fw-bold">${item.wo}</small></td>
                                    <td><small>${item.date}</small></td>
                                    <td><small>${item.customer}</small></td>
                                    <td><span class="badge bg-secondary" style="font-size: 0.7rem;">${item.status}</span></td>
                                    <td><small>${item.reason}</small></td>
                                </tr>`;
                        });
                        historySection.classList.remove('d-none');
                        snInput.classList.add('is-invalid');
                    } else {
                        historySection.classList.add('d-none');
                        snInput.classList.remove('is-invalid');
                    }
                });
        }
    }

    // ۳. بروزرسانی پیش‌نمایش Work Order
    function updateWO() {
        const selectedOption = customerSelect.options[customerSelect.selectedIndex];
        let custCode = selectedOption.getAttribute('data-code') || "00";
        if (custCode.length === 1) custCode = '0' + custCode;
        const prefix = nonOfficialCheck.checked ? "N" : "";
        document.getElementById('wo-preview').innerText = `WO Preview: ${dateCode}-${custCode}-${prefix}XX`;
    }

    customerSelect.addEventListener('change', updateWO);
    nonOfficialCheck.addEventListener('change', updateWO);
    window.onload = updateWO;
</script>
{% endblock %}
