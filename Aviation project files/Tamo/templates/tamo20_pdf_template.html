{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
    @page {
        size: A4;
        margin: 0;
    }
    body {
        margin: 0;
        padding: 0;
    }
    .container {
        position: relative;
        width: 210mm;
        height: 297mm;
        overflow: hidden;
    }
    .background {
        position: absolute;
        top: 0;
        left: 0;
        width: 210mm;
        height: 297mm;
        z-index: -1;
    }
    .field {
        position: absolute;
        font-family: Helvetica, Arial;
        font-size: 10pt;
        color: black;
    }

    /* تنظیم دقیق مختصات بر اساس میلی‌متر */
    /* اعداد زیر را برای جابجایی تغییر دهید */
    
    #wo_no     { top: 38mm;  left: 165mm; color: red; font-weight: bold; }
    #part_no   { top: 69mm;  left: 20mm;  }
    #serial_no { top: 69mm;  left: 110mm; }
    #qty       { top: 69mm;  left: 155mm; }
    #desc      { top: 61mm;  left: 20mm;  width: 100mm; }
    #date      { top: 220mm; left: 140mm; }
    
    </style>
</head>
<body>
    <div class="container">
        <img src="/home/aryatamo/site/static/1-TAMO-20(RI)-Draft.png" class="background">

        <div id="wo_no" class="field">{{ part.work_order_no }}hiiiiiiiii</div>
        <div id="part_no" class="field">{{ part.part_info.part_number }}</div>
        <div id="serial_no" class="field">{{ part.serial_number }}</div>
        <div id="desc" class="field">{{ part.part_info.description }}</div>
        <div id="date" class="field">{{ part.inspection_date|date:"Y-m-d" }}</div>
    </div>
</body>
</html>
