{% extends "base.html" %}
{% block content %}
<div class="container text-center" style="max-width: 600px; margin-top: 30px;">
    <h2>Inventory Scanner</h2>
    <button id="start-btn" class="btn btn-success mb-3" onclick="startScanner()">Enable Camera</button>
    <div id="reader" style="width: 100%; border-radius: 15px; background: #000;"></div>
    <div id="result" class="mt-4 alert" style="display:none;">
        <h4 id="status-text"></h4>
        <p id="part-info"></p>
        <button onclick="location.reload()" class="btn btn-primary">Scan Next</button>
    </div>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        let html5QrCode;
        function startScanner() {
            document.getElementById('start-btn').style.display = 'none';
            html5QrCode = new Html5Qrcode("reader");
            const config = { fps: 10, qrbox: 250 };
            html5QrCode.start(
                { facingMode: "environment" },
                config,
                (decodedText) => {
                    html5QrCode.stop();
                    fetch(decodedText, { headers: {'X-Requested-With': 'XMLHttpRequest'} })
                    .then(r => r.json())
                    .then(data => {
                        const res = document.getElementById('result');
                        res.style.display = 'block';
                        if(data.success) {
                            res.className = "alert alert-success";
                            document.getElementById('status-text').innerText = "Verified✅";
                            document.getElementById('part-info').innerText = data.part_name;
                        } else {
                            res.className = "alert alert-danger";
                            document.getElementById('status-text').innerText = "ERROR ❌";
                        }
                    });
                }
            ).catch(err => {
                alert("Camera is not Available: " + err);
                document.getElementById('start-btn').style.display = 'block';
            });
        }
    </script>
</div>
{% endblock %}
