<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>پنل آفلاین مدارک MRO</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body { background-color: #f8f9fa; font-family: Tahoma, sans-serif; }
        .offline-badge { background-color: #ffc107; color: #000; padding: 5px 10px; border-radius: 5px; font-size: 0.8rem; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>لیست آفلاین دستور کارهای تعمیراتی (Work Orders)</h2>
            <span class="offline-badge">وضعیت: آفلاین (نسخه پشتیبان)</span>
        </div>

        <table class="table table-bordered table-hover bg-white shadow-sm">
            <thead class="table-dark">
                <tr>
                    <th>شماره دستور کار</th>
                    <th>پارت نامبر (P/N)</th>
                    <th>شرح خرابی</th>
                    <th>مشاهده سند پیوست</th>
                </tr>
            </thead>
            <tbody>
                {% for order in orders %}
                <tr>
                    <td>{{ order.work_order_id }}</td>
                    <td><strong>{{ order.part_number }}</strong></td>
                    <td>{{ order.reason_of_removal }}</td>
                    <td>
                        <a href="/download/{{ order.file_name }}" class="btn btn-primary btn-sm" target="_blank">
                            باز کردن PDF
                        </a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</body>
</html>
